<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23051024%22/><path d=%22M50 15 L10 45 H90 Z M15 50 H85 V85 H15 Z M25 50 V85 M40 50 V85 M60 50 V85 M75 50 V85%22 fill=%22%23d4af37%22/></svg>">
    <title>RÉPUBLIQUE - Système Inertie</title>
    <style>
        :root {
            --navy-deep: #051024;
            --navy-light: #1c2e4a;
            --gold: #d4af37;
            --gold-dim: #8a7329;
            --white: #e8e8e8;
            --glass: rgba(20, 30, 50, 0.95);
            --border: 1px solid rgba(212, 175, 55, 0.3);
            --shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        body {
            background-color: var(--navy-deep);
            color: var(--white);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, #162447 0%, #020617 90%);
        }

        /* UI */
        .gold { color: var(--gold); }
        .bold { font-weight: 700; }
        .panel {
            background: var(--glass);
            border: var(--border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column;
        }

        /* SCREENS */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* SELECTION */
        #selection-screen { align-items: center; justify-content: center; padding: 20px; }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; width: 90%; max-width: 1100px; max-height: 80vh; overflow-y: auto; padding-right:10px;
        }
        .card { 
            padding: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; background: rgba(255,255,255,0.02); transition: 0.3s;
        }
        .card:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); transform: translateY(-5px); }

        /* GAMEBOARD */
        #game-screen {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: 60px 1fr 70px;
            gap: 15px; padding: 15px; box-sizing: border-box;
        }

        header {
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border); padding: 0 20px; background: rgba(5, 16, 36, 0.95);
        }

        /* STATS */
        .stat-line { margin-bottom: 10px; font-size: 0.8em; }
        .bar-container { background: rgba(255,255,255,0.05); height: 6px; margin-top: 4px; border-radius: 2px; overflow: hidden;}
        .bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.6s ease-out; }
        .inertia-icon { margin-left: 5px; font-size: 0.9em; }

        /* CENTER */
        #center-zone { position: relative; display: flex; align-items: center; justify-content: center; }
        .event-card { 
            width: 100%; max-width: 750px; max-height: 85vh; overflow-y: auto; 
            padding: 30px; border-top: 4px solid var(--gold);
        }
        
        /* BUTTONS */
        .choice-btn {
            width: 100%; padding: 18px; margin: 12px 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.0) 100%);
            border: 1px solid rgba(255,255,255,0.1); border-left: 3px solid var(--gold-dim);
            color: #ddd; text-align: left; cursor: pointer; transition: 0.2s; 
            font-size: 1em; position: relative;
        }
        .choice-btn:hover { 
            background: rgba(212, 175, 55, 0.1); border-color: var(--gold); 
            color: #fff; transform: translateX(5px); 
        }
        .spec-tag {
            font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px;
            color: var(--gold); display: block; margin-bottom: 5px; opacity: 0.8;
        }

        /* END */
        #results-screen { align-items: center; justify-content: center; text-align: center; }
        .result-box { max-width: 600px; padding: 40px; background: var(--navy-light); border: 2px solid var(--gold); }
    </style>
</head>
<body>

<div id="selection-screen" class="screen active">
    <div style="text-align:center; margin-bottom: 20px;">
        <h1 class="gold" style="font-size: 3em; letter-spacing: 8px; margin: 0;">RÉPUBLIQUE</h1>
        <span style="text-transform:uppercase; font-size: 0.9em; letter-spacing: 3px; opacity: 0.7;">Simulation Politique & Inertie Sociologique</span>
    </div>
    <div class="grid" id="roster"></div>
</div>

<div id="game-screen" class="screen">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-size:1.5em;">🇫🇷</span>
            <div style="display:flex; flex-direction:column;">
                <span class="bold" style="letter-spacing:1px;">ÉLYSÉE 2017</span>
                <span id="candidate-name" style="font-size:0.8em; opacity:0.7; color:var(--gold);">...</span>
            </div>
        </div>
        <div id="date-display" class="gold bold" style="font-size: 1.1em;">DATE</div>
        <div style="font-size:0.9em; opacity:0.6;">TOUR <span id="turn-count">1</span></div>
    </header>

    <div class="panel">
        <h4 class="gold" style="margin: 0 0 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:10px;">INTENTIONS DE VOTE</h4>
        <div id="polls-container" style="overflow-y: auto; flex:1; padding-right:5px;"></div>
    </div>

    <div id="center-zone">
        <div class="panel event-card">
            <span id="event-badge" style="background:var(--gold); color:#000; padding:3px 8px; font-size:0.7em; font-weight:bold; border-radius:2px; display:inline-block; margin-bottom:10px;">ACTUALITÉ</span>
            <h2 id="event-title" class="gold" style="margin-top:0; font-size: 1.8em;">Titre</h2>
            <p id="event-desc" style="line-height: 1.6; font-size: 1.1em; margin-bottom: 30px; color: #ccc;">Description...</p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="panel" style="align-items:center; justify-content:center;">
        <span style="font-size:0.9em; text-transform:uppercase; opacity:0.7; letter-spacing:1px;">Score National</span>
        <div id="main-score" style="font-size: 4.5em; font-weight: 800; color: var(--gold); margin: 15px 0; text-shadow: 0 0 20px rgba(212,175,55,0.3);">0%</div>
        <div id="trend-indicator" style="font-size: 1em; color:var(--white);">--</div>
    </div>

    <div class="panel" style="grid-column: 1 / -1; flex-direction: row; justify-content: space-evenly; align-items: center; opacity: 0.6; font-size: 0.9em;">
        <span>📢 MEETING</span>
        <span>📺 MÉDIAS</span>
        <span>💰 FINANCES</span>
        <span>⚖️ JUSTICE</span>
        <span>👥 QG</span>
    </div>
</div>

<div id="results-screen" class="screen">
    <div class="result-box">
        <h1 class="gold" style="margin-top:0;">RÉSULTATS</h1>
        <div id="final-score" style="font-size: 5em; font-weight: 800; color: #fff;">00.0%</div>
        <h2 id="final-status" style="color:var(--gold); margin-bottom: 20px;">STATUT</h2>
        <p id="final-desc" style="font-style:italic; line-height:1.6; opacity: 0.9;">...</p>
        <button onclick="location.reload()" style="margin-top:30px; padding:15px 30px; background:var(--gold); border:none; font-weight:bold; cursor:pointer; text-transform:uppercase;">Rejouer</button>
    </div>
</div>


    <script src="data.js"></script>   <script src="script.js"></script> 

</script>
</body>
</html>
