<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉPUBLIQUE - La Campagne de 2017</title>
    <style>
        :root {
            --navy-deep: #051024; /* Bleu Nuit Présidentiel */
            --navy-light: #1c2e4a;
            --gold: #d4af37;
            --gold-dim: #8a7329;
            --white: #e8e8e8;
            --glass: rgba(20, 30, 50, 0.95);
            --border: 1px solid rgba(212, 175, 55, 0.3);
            --shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        body {
            background-color: var(--navy-deep);
            color: var(--white);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, #162447 0%, #020617 90%);
        }

        /* --- UI HELPERS --- */
        .gold { color: var(--gold); }
        .bold { font-weight: 700; }
        
        .panel {
            background: var(--glass);
            border: var(--border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column;
        }

        /* --- SCREENS --- */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* SELECTION */
        #selection-screen { align-items: center; justify-content: center; padding: 20px; }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; width: 90%; max-width: 1100px; max-height: 80vh; overflow-y: auto;
            padding-right: 10px;
        }
        .card { 
            padding: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; background: rgba(255,255,255,0.02); transition: 0.3s;
        }
        .card:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); transform: translateY(-5px); }

        /* GAMEBOARD */
        #game-screen {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: 60px 1fr 70px;
            gap: 15px; padding: 15px; box-sizing: border-box;
        }

        header {
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border); padding: 0 20px; background: rgba(5, 16, 36, 0.95);
        }

        /* STATS & BARS */
        .stat-line { margin-bottom: 10px; font-size: 0.8em; }
        .bar-container { background: rgba(255,255,255,0.05); height: 6px; margin-top: 4px; border-radius: 2px; overflow: hidden;}
        .bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.6s ease-out; }

        /* CENTER EVENT AREA */
        #center-zone { position: relative; display: flex; align-items: center; justify-content: center; }
        .event-card { 
            width: 100%; max-width: 750px; max-height: 85vh; overflow-y: auto; 
            padding: 30px; border-top: 4px solid var(--gold);
        }
        
        /* CHOICES BUTTONS */
        .choice-btn {
            width: 100%; padding: 18px; margin: 12px 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.0) 100%);
            border: 1px solid rgba(255,255,255,0.1); border-left: 3px solid var(--gold-dim);
            color: #ddd; text-align: left; cursor: pointer; transition: 0.2s; 
            font-size: 1em; position: relative;
        }
        .choice-btn:hover { 
            background: rgba(212, 175, 55, 0.1); border-color: var(--gold); 
            color: #fff; transform: translateX(5px); 
        }
        .spec-tag {
            font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px;
            color: var(--gold); display: block; margin-bottom: 5px; opacity: 0.8;
        }

        /* END SCREEN */
        #results-screen { align-items: center; justify-content: center; text-align: center; }
        .result-box { max-width: 600px; padding: 40px; background: var(--navy-light); border: 2px solid var(--gold); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

    </style>
</head>

    // --- MEETING PLACES ---
    const MEETING_PLACES = [
        { name: "Paris (Bercy)", type: "Grand-Messe", eff: { cadres: 4, intermediaires: 3, ouvriers: -2 } },
        { name: "Hénin-Beaumont", type: "Populaire", eff: { ouvriers: 5, employes: 3, cadres: -4 } },
        { name: "La Courneuve", type: "Banlieue", eff: { inactifs: 6, ouvriers: 2, retraites: -4 } },
        { name: "Nice", type: "Sécuritaire", eff: { retraites: 5, artisans: 3, inactifs: -3 } },
        { name: "Quimper", type: "Régional", eff: { agriculteurs: 4, artisans: 3 } },
        { name: "Saclay", type: "Tech/Innovation", eff: { cadres: 5, inactifs: 3, ouvriers: -3 } },
        { name: "Vénissieux", type: "Ouvrier", eff: { ouvriers: 5, inactifs: 2, cadres: -3 } },
        { name: "Versailles", type: "Conservateur", eff: { retraites: 6, cadres: 2, inactifs: -4 } }
    ];

    // --- GAME STATE ---
    let gameState = {
        candidate: null,
        turn: 1,
        eventQueue: []
    };

    // --- MOTEUR ---

    function initRoster() {
        const d = document.getElementById('roster');
        CANDIDATES.forEach(c => {
            let el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<h3 class="gold">${c.name}</h3><small>${c.party}</small>`;
            el.onclick = () => startGame(c);
            d.appendChild(el);
        });
    }

    function startGame(c) {
        gameState.candidate = c;
        gameState.turn = 1;
        
        // Init Stats
        for (let k in c.stats) {
            if(POPULATION[k]) POPULATION[k].score = c.stats[k];
        }

        // Init Events: On utilise la liste fixe SCENARIO_EVENTS
        // On copie le tableau pour ne pas modifier l'original
        gameState.eventQueue = [...SCENARIO_EVENTS]; 

        // UI
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('candidate-name').innerText = c.name;

        updateUI();
        playTurn();
    }

    function playTurn() {
        // --- SECURITE FIN DE JEU ---
        // Si plus d'events ou max tours atteint
        if (gameState.eventQueue.length === 0 || gameState.turn > 30) {
            endGame();
            return; 
        }

        // --- MEETING TOUS LES 3 TOURS (3, 6, 9...) ---
        if (gameState.turn % 3 === 0) {
            showMeeting();
        } else {
            // Event normal
            let evt = gameState.eventQueue.shift(); // Prend le prochain
            if(!evt) { endGame(); return; } 
            showEvent(evt);
        }
    }

    function showEvent(evt) {
        document.getElementById('date-display').innerText = evt.date;
        document.getElementById('turn-count').innerText = gameState.turn;
        
        document.getElementById('event-badge').innerText = "ACTUALITÉ";
        document.getElementById('event-badge').style.background = "var(--gold)";
        
        document.getElementById('event-title').innerText = evt.title;
        document.getElementById('event-desc').innerText = evt.desc;

        const c = document.getElementById('choices-container');
        c.innerHTML = '';

        evt.choices.forEach(ch => {
            // Check condition (ex: Fillon only)
            if (ch.cond && ch.cond !== gameState.candidate.id) return;

            let btn = document.createElement('div');
            btn.className = 'choice-btn';
            
            // Si c'est un choix spécifique, on ajoute un petit label visuel
            let label = ch.cond ? `<span class="spec-tag">RÉPONSE SPÉCIFIQUE</span>` : "";
            
            btn.innerHTML = `${label}➤ ${ch.txt}`;
            btn.onclick = () => {
                applyEffect(ch.eff);
                nextTurn();
            };
            c.appendChild(btn);
        });
    }

    function showMeeting() {
        document.getElementById('turn-count').innerText = gameState.turn;
        document.getElementById('event-badge').innerText = "ORGANISATION";
        document.getElementById('event-badge').style.background = "#fff";

        document.getElementById('event-title').innerText = "Grand Meeting";
        document.getElementById('event-desc').innerText = "C'est l'heure de rassembler vos militants. Choisissez une ville stratégique.";

        const c = document.getElementById('choices-container');
        c.innerHTML = '';

        // Pick 3 random places
        let places = [...MEETING_PLACES].sort(() => 0.5 - Math.random()).slice(0, 3);
        
        places.forEach(p => {
            let btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span class="bold">${p.name}</span> <span style="font-style:italic; opacity:0.7; font-size:0.9em;">(Cible: ${p.type})</span>`;
            btn.onclick = () => {
                applyEffect(p.eff);
                nextTurn();
            };
            c.appendChild(btn);
        });
    }

    function applyEffect(eff) {
        for (let k in eff) {
            if(POPULATION[k]) {
                // Application du NERF (Impact Factor)
                let val = eff[k] * IMPACT_FACTOR;
                POPULATION[k].score += val;
                // Caps strictes 0-100
                if(POPULATION[k].score < 0) POPULATION[k].score = 0;
                if(POPULATION[k].score > 100) POPULATION[k].score = 100;
            }
        }
    }

    function nextTurn() {
        gameState.turn++;
        updateUI();
        playTurn(); 
    }

    function getGlobalScore() {
        let total = 0;
        let w = 0;
        for(let k in POPULATION) {
            total += POPULATION[k].score * POPULATION[k].weight;
            w += POPULATION[k].weight;
        }
        return total / w;
    }

    function updateUI() {
        // Polls
        const d = document.getElementById('polls-container');
        d.innerHTML = '';
        let sorted = Object.keys(POPULATION).sort((a,b) => POPULATION[b].score - POPULATION[a].score);
        
        sorted.forEach(k => {
            let p = POPULATION[k];
            let row = document.createElement('div');
            row.className = 'stat-line';
            let color = p.score > 50 ? 'var(--gold)' : (p.score < 15 ? '#c0392b' : '#ddd');
            
            row.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span>${p.label}</span>
                    <span style="color:${color}">${p.score.toFixed(1)}%</span>
                </div>
                <div class="bar-container"><div class="bar-fill" style="width:${p.score}%; background:${color}"></div></div>
            `;
            d.appendChild(row);
        });

        // Global
        let sc = getGlobalScore();
        document.getElementById('main-score').innerText = sc.toFixed(1) + "%";
        
        // Trend
        let t = "Stable";
        if (sc >= 50) t = "▲ Élu 1er tour";
        else if (sc >= 20) t = "▲ Qualifié 2nd tour";
        else t = "▼ En difficulté";
        document.getElementById('trend-indicator').innerText = t;
    }

    function endGame() {
        // Force Hide Game / Show Results
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('game-screen').style.display = 'none'; 
        
        document.getElementById('results-screen').classList.add('active');
        document.getElementById('results-screen').style.display = 'flex';

        let sc = getGlobalScore();
        document.getElementById('final-score').innerText = sc.toFixed(2) + "%";

        let st = ""; 
        let txt = "";
        
        if (sc >= 50) {
            st = "PRÉSIDENT DE LA RÉPUBLIQUE";
            txt = "Un triomphe absolu dès le premier tour. L'Histoire est en marche.";
        } else if (sc >= 18) {
            st = "QUALIFIÉ SECOND TOUR";
            txt = "La bataille continue. Vous êtes en finale. Tout est possible.";
        } else if (sc >= 5) {
            st = "DÉFAITE HONORABLE";
            txt = "Vous ne serez pas président, mais vos frais de campagne sont remboursés.";
        } else {
            st = "NAUFRAGE POLITIQUE";
            txt = "Score humiliant. Votre parti va probablement disparaître.";
        }

        document.getElementById('final-status').innerText = st;
        document.getElementById('final-desc').innerText = txt;
    }

    // Start
    initRoster();
