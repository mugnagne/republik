<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉPUBLIQUE - Édition Intégrale</title>
    <style>
        :root {
            --navy-deep: #051024;
            --navy-light: #0f2545;
            --gold: #d4af37;
            --gold-dim: #8a7329;
            --white-off: #e6e6e6;
            --red-alert: #c0392b;
            --glass: rgba(15, 37, 69, 0.9);
            --glass-border: rgba(212, 175, 55, 0.3);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--navy-deep);
            color: var(--white-off);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a2f50 0%, #051024 85%);
        }

        /* TYPO & UTILS */
        h1, h2, h3, h4 { text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; }
        .gold-text { color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .bold { font-weight: 700; }
        
        .glass-panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* BUTTONS */
        button {
            background: linear-gradient(135deg, rgba(15, 37, 69, 1) 0%, rgba(5, 16, 36, 1) 100%);
            border: 1px solid var(--gold-dim);
            color: var(--white-off);
            padding: 15px;
            cursor: pointer;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s;
            border-radius: 4px;
            font-size: 0.95em;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(5px);
        }

        button::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--gold-dim);
            transition: width 0.2s;
        }
        button:hover::before { width: 8px; background: var(--gold); }

        /* SCREENS */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* SELECTION */
        #selection-screen { align-items: center; justify-content: center; padding: 20px; }
        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 80%;
            max-height: 70vh;
            overflow-y: auto;
            margin-top: 30px;
        }
        .candidate-card {
            padding: 15px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }
        .candidate-card:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); }

        /* GAME LAYOUT */
        #game-screen {
            display: grid;
            grid-template-columns: 260px 1fr 260px;
            grid-template-rows: 60px 1fr 70px;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dim);
            padding: 0 10px;
            background: rgba(5, 16, 36, 0.8);
        }

        /* STATS BARS */
        .stat-row { margin-bottom: 12px; font-size: 0.8em; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; margin-top: 5px; overflow: hidden;}
        .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }

        /* CENTER AREA */
        #center-stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .map-bg {
            position: absolute;
            width: 90%; height: 90%;
            background: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" fill="none" stroke="%23d4af37" stroke-width="0.5" opacity="0.1"/></svg>') center no-repeat;
            background-size: contain;
            opacity: 0.4;
            z-index: 0;
            animation: breathe 6s infinite ease-in-out;
        }
        @keyframes breathe { 0%, 100% { transform: scale(0.95); opacity: 0.3; } 50% { transform: scale(1.05); opacity: 0.5; } }

        .event-card {
            width: 100%; max-width: 700px;
            z-index: 10;
            max-height: 85vh;
            overflow-y: auto;
        }

        .event-tag {
            font-size: 0.7em;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--gold);
            color: var(--navy-deep);
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        /* BOTTOM DOCK */
        #bottom-dock {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: center;
            background: rgba(5, 16, 36, 0.95);
            border-top: 1px solid var(--gold-dim);
            border-radius: 12px 12px 0 0;
        }
        .dock-item { opacity: 0.5; font-size: 0.8em; text-align: center; }

        /* RESULTS SCREEN */
        #results-screen { align-items: center; text-align: center; padding-top: 50px; overflow-y: auto;}
        .big-score { font-size: 5em; font-weight: 800; color: var(--gold); margin: 10px 0; }
        .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; text-align: left; margin-top: 30px; width: 60%; }
        .win-banner { color: #2ecc71; border: 1px solid #2ecc71; padding: 10px; display: inline-block; margin-bottom: 20px; }
        .lose-banner { color: #e74c3c; border: 1px solid #e74c3c; padding: 10px; display: inline-block; margin-bottom: 20px; }

    </style>
</head>

    // --- GAME STATE ---
    let gameState = {

    // --- LOGIC ---

    function initSelection() {
        const container = document.getElementById('candidates-container');
        container.innerHTML = '';
        CANDIDATES.forEach(c => {
            let div = document.createElement('div');
            div.className = 'candidate-card glass-panel';
            div.innerHTML = `<h3 class="gold-text">${c.name}</h3><div style="font-size:0.8em; opacity:0.7;">${c.party}</div>`;
            div.onclick = () => startGame(c);
            container.appendChild(div);
        });
    }

    function startGame(candidate) {
        gameState.candidate = candidate;
        gameState.turn = 1;
        gameState.history = [];

        // Apply base stats
        for (let key in candidate.baseStats) {
            if(POPULATION[key]) POPULATION[key].score = candidate.baseStats[key];
        }
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('results-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('candidate-display').innerText = candidate.name;
        
        updateUI();
        nextPhase();
    }

    function nextPhase() {
        // --- FIX CRITIQUE : VÉRIFICATION DE FIN DE JEU AU DÉBUT ---
        if (gameState.turn > MAX_TURNS) {
            endGame();
            return; 
        }

        const title = document.getElementById('event-title');
        const desc = document.getElementById('event-desc');
        const tag = document.getElementById('event-tag');
        const container = document.getElementById('choices-container');
        container.innerHTML = ''; // Clear previous buttons

        // 1. DEBATS (Tours 5, 10, 15)
        if (gameState.turn === 5 || gameState.turn === 10 || gameState.turn === 15) {
            tag.innerText = gameState.turn === 15 ? "DÉBAT FINAL" : "DÉBAT TÉLÉVISÉ";
            tag.style.background = "#c0392b";
            title.innerText = gameState.turn === 15 ? "Le Face-à-Face" : "Le Grand Débat";
            desc.innerText = "Vous êtes en direct devant des millions de Français. C'est le moment de cibler un adversaire pour l'affaiblir ou récupérer son électorat.";
            
            // Randomly pick 3 rivals
            let rivals = CANDIDATES.filter(c => c.id !== gameState.candidate.id);
            let choices = rivals.sort(() => 0.5 - Math.random()).slice(0, 3);
            
            choices.forEach(rival => {
                let btn = document.createElement('button');
                btn.innerHTML = `Attaquer <strong>${rival.name}</strong>`;
                btn.onclick = () => {
                    resolveDebate(rival);
                    finishTurn();
                }
                container.appendChild(btn);
            });
             
             let defBtn = document.createElement('button');
             defBtn.innerHTML = `<strong>Ne pas attaquer</strong> (Défendre son bilan)`;
             defBtn.onclick = () => {
                 applyEffects({ cadres: 2, retraites: 2, ouvriers: -2 });
                 finishTurn();
             }
             container.appendChild(defBtn);
             return;
        }

        // 2. MEETING (Tous les tours pairs, sauf si débat)
        if (gameState.turn % 2 === 0) {
            tag.innerText = "ORGANISATION";
            tag.style.background = "#fff"; 
            tag.style.color = "#000";
            title.innerText = "Grand Meeting";
            desc.innerText = "Où souhaitez-vous organiser votre rassemblement cette semaine ?";

            let locations = [...MEETING_LOCATIONS].sort(() => 0.5 - Math.random()).slice(0, 4);
            locations.forEach(loc => {
                let btn = document.createElement('button');
                btn.innerHTML = `<strong>${loc.name}</strong> <br><span style="font-size:0.8em; opacity:0.6;">Type: ${loc.type}</span>`;
                btn.onclick = () => {
                    applyEffects(loc.effects);
                    finishTurn();
                }
                container.appendChild(btn);
            });
            return;
        }

        // 3. EVENT CLASSIC (Tous les tours impairs)
        tag.innerText = "ACTUALITÉ";
        tag.style.background = "var(--gold)";
        tag.style.color = "#000";
        
        let specific = SPECIFIC_EVENTS.find(e => e.candidateId === gameState.candidate.id && !gameState.history.includes(e.title));
        let evt;
        
        if (specific && Math.random() > 0.6) {
            evt = specific;
        } else {
            let pool = GENERAL_EVENTS.filter(e => !gameState.history.includes(e.title));
            if(pool.length === 0) pool = GENERAL_EVENTS; 
            evt = pool[Math.floor(Math.random() * pool.length)];
        }
        
        gameState.history.push(evt.title);
        title.innerText = evt.title;
        desc.innerText = evt.desc;

        evt.choices.forEach(c => {
            let btn = document.createElement('button');
            btn.innerText = c.text;
            btn.onclick = () => {
                applyEffects(c.effects);
                finishTurn();
            }
            container.appendChild(btn);
        });
    }

    function resolveDebate(target) {
        let effects = {};
        // Logic simplified to avoid crash if IDs don't match exactly
        if (['fillon', 'lepen', 'dupont', 'asselineau', 'lassalle', 'cheminade'].includes(target.id)) {
            // Attacking Right/Souverainistes
            effects = { inactifs: 4, intermediaires: 3, cadres: 2, retraites: -5, agriculteurs: -4 };
        } else if (['melenchon', 'hamon', 'poutou', 'arthaud'].includes(target.id)) {
            // Attacking Left
            effects = { cadres: 4, retraites: 4, artisans: 3, inactifs: -5, ouvriers: -4 };
        } else {
            // Attacking Center (Macron)
            effects = { ouvriers: 3, retraites: -2, cadres: -4 };
        }
        applyEffects(effects);
    }

    function finishTurn() {
        gameState.turn++;
        
        // --- FIX CRITIQUE : Si on dépasse le max, on force la fin sans updateUI ---
        if (gameState.turn > MAX_TURNS) {
            endGame();
        } else {
            updateUI();
            nextPhase();
        }
    }

    function applyEffects(effects) {
        for (let key in effects) {
            if (POPULATION[key]) {
                POPULATION[key].score += effects[key];
                // Safety caps
                if(POPULATION[key].score > 100) POPULATION[key].score = 100;
                if(POPULATION[key].score < 0) POPULATION[key].score = 0;
            }
        }
    }

    function calculateTotal() {
        let total = 0;
        let weight = 0;
        for (let k in POPULATION) {
            total += POPULATION[k].score * POPULATION[k].weight;
            weight += POPULATION[k].weight;
        }
        return (total / weight);
    }

    function updateUI() {
        // Turn display
        document.getElementById('turn-display').innerText = `SEMAINE ${gameState.turn} / ${MAX_TURNS}`;
        
        // Stats
        const div = document.getElementById('population-stats');
        div.innerHTML = '';
        let sorted = Object.keys(POPULATION).sort((a,b) => POPULATION[b].score - POPULATION[a].score);
        
        sorted.forEach(k => {
            let p = POPULATION[k];
            let color = p.score > 50 ? 'var(--gold)' : (p.score < 30 ? '#c0392b' : '#fff');
            
            div.innerHTML += `
            <div class="stat-row">
                <div style="display:flex; justify-content:space-between;">
                    <span>${p.label}</span>
                    <span style="color:${color}">${Math.round(p.score)}%</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" style="width:${p.score}%; background:${color}"></div></div>
            </div>`;
        });

        // Main Score
        let score = calculateTotal();
        document.getElementById('main-score').innerText = score.toFixed(1) + "%";
        
        // Next phase indication
        let nextT = "Évènement";
        if (gameState.turn === 5 || gameState.turn === 10 || gameState.turn === 15) nextT = "DÉBAT !";
        else if (gameState.turn % 2 === 0) nextT = "Meeting";
        document.getElementById('next-type').innerText = nextT;
    }

    function endGame() {
        // 1. Force screen switch using direct style if classes fail
        const gameScreen = document.getElementById('game-screen');
        const resScreen = document.getElementById('results-screen');
        
        gameScreen.classList.remove('active');
        gameScreen.style.display = 'none'; // Force hide
        
        resScreen.classList.add('active');
        resScreen.style.display = 'flex'; // Force show

        // 2. Calculate score safely
        let score = 0;
        try {
            score = calculateTotal();
        } catch(e) { score = 0; }
        
        document.getElementById('final-score-display').innerText = score.toFixed(2) + "%";
        
        // 3. Set Banner
        let banner = document.getElementById('win-lose-banner');
        let text = document.getElementById('final-analysis');
        let analysis = "";

        if (score >= 50) {
            banner.innerHTML = "<div class='win-banner' style='color:#2ecc71; border:1px solid #2ecc71; padding:10px;'>VICTOIRE AU PREMIER TOUR</div>";
            analysis = "C'est un raz-de-marée historique. La Vème République n'a jamais vu un tel triomphe.";
        } else if (score >= 20) {
            banner.innerHTML = "<div class='win-banner' style='color:#2ecc71; border:1px solid #2ecc71; padding:10px;'>QUALIFIÉ AU SECOND TOUR</div>";
            analysis = "Vous êtes au second tour ! Tout va se jouer dans les deux prochaines semaines.";
        } else if (score >= 5) {
            banner.innerHTML = "<div class='lose-banner' style='color:#e74c3c; border:1px solid #e74c3c; padding:10px;'>DÉFAITE</div>";
            analysis = "Vous ne passez pas le premier tour, mais l'honneur est sauf (frais remboursés).";
        } else {
            banner.innerHTML = "<div class='lose-banner' style='color:#e74c3c; border:1px solid #e74c3c; padding:10px;'>CATASTROPHE</div>";
            analysis = "Score humiliant. Votre parti va probablement disparaître.";
        }
        text.innerText = analysis;

        // 4. Breakdown
        let grid = document.getElementById('final-breakdown');
        grid.innerHTML = '';
        Object.keys(POPULATION).forEach(k => {
            let p = POPULATION[k];
            grid.innerHTML += `<div style="margin-bottom:5px;"><strong>${p.label}:</strong> <span class="gold-text">${Math.round(p.score)}%</span></div>`;
        });
    }

    // INIT
    initSelection();

</script>
</body>
</html>
