<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉPUBLIQUE - Édition Historique</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: rgba(20, 20, 25, 0.95);
            --gold: #d4af37;
            --gold-dim: #8a7329;
            --text-main: #e0e0e0;
            --accent-red: #c0392b;
            --accent-blue: #2980b9;
            --border: 1px solid rgba(212, 175, 55, 0.2);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, #1a1a20 0%, #000000 90%);
        }

        /* UI UTILS */
        .gold { color: var(--gold); }
        .bold { font-weight: 700; }
        .panel {
            background: var(--bg-panel);
            border: var(--border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* SCREENS */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* SELECTION */
        #selection-screen { align-items: center; justify-content: center; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; width: 80%; padding: 20px;}
        .card { 
            padding: 15px; cursor: pointer; border: 1px solid transparent; text-align: center; background: rgba(255,255,255,0.05); transition: 0.2s;
        }
        .card:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); transform: translateY(-3px);}

        /* GAMEBOARD */
        #game-screen {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: 60px 1fr 100px;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border);
            padding: 0 20px;
            background: rgba(0,0,0,0.8);
        }

        /* STATS */
        .stat-row { margin-bottom: 8px; font-size: 0.75em; }
        .bar-bg { background: rgba(255,255,255,0.1); height: 6px; margin-top: 2px; }
        .bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.5s; }

        /* CENTER EVENT */
        #center-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .event-box { width: 100%; max-width: 650px; z-index: 10; max-height: 80vh; overflow-y: auto; }
        
        .date-badge { 
            font-size: 0.8em; letter-spacing: 1px; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 5px; display: block;
        }

        button.choice {
            width: 100%; padding: 15px; margin: 8px 0;
            background: linear-gradient(90deg, rgba(20,20,20,1) 0%, rgba(40,40,45,1) 100%);
            border: 1px solid #444; color: #fff;
            text-align: left; cursor: pointer; transition: 0.2s;
            position: relative; overflow: hidden;
        }
        button.choice:hover { border-color: var(--gold); transform: translateX(5px); }
        button.choice::before { content:''; position: absolute; left:0; top:0; bottom:0; width:3px; background: transparent; transition: 0.2s;}
        button.choice:hover::before { background: var(--gold); }

        /* END SCREEN */
        #results-screen { align-items: center; justify-content: flex-start; padding-top: 40px; overflow-y: auto; text-align: center;}
        .scenario-box { 
            max-width: 700px; margin-top: 20px; padding: 20px; 
            border: 1px solid var(--gold); background: rgba(0,0,0,0.5);
            font-style: italic; line-height: 1.6;
        }

    </style>
</head>
<body>

<div id="selection-screen" class="screen active">
    <h1 style="letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 0;">2017 : Le Choc</h1>
    <p style="opacity: 0.6; margin-top: 5px;">Choisissez votre destinataire</p>
    <div class="grid" id="roster"></div>
</div>

<div id="game-screen" class="screen">
    <header>
        <div style="font-weight:bold;">🇫🇷 ÉLYSÉE 2017</div>
        <div id="date-display" class="gold">...</div>
        <div id="candidate-name" style="opacity:0.7">...</div>
    </header>

    <div class="panel" style="display:flex; flex-direction:column;">
        <h4 class="gold" style="margin:0 0 15px 0;">SONDAGES CSP</h4>
        <div id="poll-container" style="flex:1; overflow-y: auto;"></div>
    </div>

    <div id="center-zone">
        <div class="event-box panel" id="event-panel">
            <span id="event-date" class="date-badge">DATE</span>
            <h2 id="event-title" style="margin-top:0; color: #fff;">TITRE</h2>
            <div id="event-desc" style="margin-bottom: 20px; line-height: 1.5; font-size: 1.1em; color: #ccc;">...</div>
            <div id="choices-area"></div>
        </div>
    </div>

    <div class="panel" style="text-align:center; display:flex; flex-direction:column; justify-content:center;">
        <div style="font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px;">Intentions de vote</div>
        <div id="main-score" style="font-size: 4.5em; font-weight: 800; color: var(--gold); margin: 10px 0;">0%</div>
        <div id="trend-text" style="color: #888; font-size: 0.9em;">--</div>
    </div>

    <div class="panel" style="grid-column: 1 / -1; display:flex; align-items:center; justify-content:center; gap: 30px; opacity: 0.5;">
        <span>📢 CAMPAGNE</span>
        <span>📺 MÉDIAS</span>
        <span>💰 FINANCES</span>
        <span>⚖️ JUSTICE</span>
    </div>
</div>

<div id="results-screen" class="screen">
    <h1 class="gold">RÉSULTATS DÉFINITIFS</h1>
    <div id="end-score" style="font-size: 6em; font-weight: 800;">00.0%</div>
    <div id="end-status" style="font-size: 1.5em; margin-bottom: 20px; font-weight: bold;">STATUT</div>
    
    <div class="scenario-box">
        <h3 style="color:var(--gold); margin-top:0;">SCÉNARIO PROSPECTIF</h3>
        <p id="end-scenario-text">...</p>
    </div>

    <button onclick="location.reload()" style="margin-top: 30px; padding: 15px 30px; background: var(--gold); border:none; font-weight:bold; cursor:pointer;">REJOUER L'HISTOIRE</button>
</div>

<script>
    // --- 1. CONFIGURATION ---
    const GAME_LENGTH = 30; // Nombre d'évènements max par partie

    // --- 2. DONNEES CANDIDATS (Avec Affinités) ---
    // Affinity: > 1.0 = Bonus (Facile à convaincre), < 1.0 = Malus (Difficile)
    const CANDIDATES = [
        { 
            id: 'macron', name: "Emmanuel MACRON", party: "En Marche!", 
            baseStats: { agriculteurs: 15, artisans: 25, cadres: 60, intermediaires: 45, employes: 20, ouvriers: 10, retraites: 35, inactifs: 25 },
            affinities: { cadres: 1.5, finance: 1.5, ouvriers: 0.5, agriculteurs: 0.6 }
        },
        { 
            id: 'fillon', name: "François FILLON", party: "Les Républicains", 
            baseStats: { agriculteurs: 70, artisans: 50, cadres: 55, intermediaires: 20, employes: 10, ouvriers: 5, retraites: 65, inactifs: 5 },
            affinities: { retraites: 1.5, agriculteurs: 1.5, inactifs: 0.3, ouvriers: 0.4 }
        },
        { 
            id: 'lepen', name: "Marine LE PEN", party: "Front National", 
            baseStats: { agriculteurs: 40, artisans: 45, cadres: 5, intermediaires: 25, employes: 50, ouvriers: 65, retraites: 25, inactifs: 30 },
            affinities: { ouvriers: 1.5, employes: 1.3, cadres: 0.2, inactifs: 0.8 }
        },
        { 
            id: 'melenchon', name: "J-L. MÉLENCHON", party: "La France Insoumise", 
            baseStats: { agriculteurs: 5, artisans: 5, cadres: 20, intermediaires: 30, employes: 25, ouvriers: 35, retraites: 10, inactifs: 55 },
            affinities: { inactifs: 1.5, ouvriers: 1.2, cadres: 0.6, finance: 0.1 }
        },
        { 
            id: 'hamon', name: "Benoît HAMON", party: "Parti Socialiste", 
            baseStats: { agriculteurs: 2, artisans: 5, cadres: 25, intermediaires: 25, employes: 15, ouvriers: 10, retraites: 15, inactifs: 25 },
            affinities: { inactifs: 1.3, cadres: 1.1, ouvriers: 0.7 }
        },
        { id: 'dupont', name: "N. DUPONT-AIGNAN", party: "DLF", baseStats: { agriculteurs: 20, artisans: 20, cadres: 5, intermediaires: 5, employes: 10, ouvriers: 15, retraites: 20, inactifs: 5 }, affinities: { retraites: 1.2 } },
        { id: 'lassalle', name: "Jean LASSALLE", party: "Résistons", baseStats: { agriculteurs: 50, artisans: 10, cadres: 2, intermediaires: 5, employes: 5, ouvriers: 10, retraites: 15, inactifs: 5 }, affinities: { agriculteurs: 2.0, cadres: 0.1 } },
        { id: 'poutou', name: "Philippe POUTOU", party: "NPA", baseStats: { agriculteurs: 0, artisans: 0, cadres: 2, intermediaires: 5, employes: 10, ouvriers: 20, retraites: 2, inactifs: 15 }, affinities: { ouvriers: 1.5, cadres: 0.0 } },
        { id: 'arthaud', name: "Nathalie ARTHAUD", party: "LO", baseStats: { agriculteurs: 0, artisans: 0, cadres: 0, intermediaires: 2, employes: 5, ouvriers: 10, retraites: 2, inactifs: 5 }, affinities: { ouvriers: 1.5 } },
        { id: 'asselineau', name: "F. ASSELINEAU", party: "UPR", baseStats: { agriculteurs: 2, artisans: 2, cadres: 2, intermediaires: 2, employes: 2, ouvriers: 2, retraites: 2, inactifs: 5 }, affinities: {} },
        { id: 'cheminade', name: "Jacques CHEMINADE", party: "S&P", baseStats: { agriculteurs: 0, artisans: 0, cadres: 1, intermediaires: 0, employes: 0, ouvriers: 0, retraites: 0, inactifs: 1 }, affinities: {} }
    ];

    const POPULATION = {
        agriculteurs: { label: "Agriculteurs", weight: 1.5, score: 50 },
        artisans: { label: "Artisans/Chefs", weight: 6.7, score: 50 },
        cadres: { label: "Cadres/Sup", weight: 22.4, score: 50 },
        intermediaires: { label: "Prof. Interm.", weight: 25.1, score: 50 },
        employes: { label: "Employés", weight: 25.2, score: 50 },
        ouvriers: { label: "Ouvriers", weight: 18.6, score: 50 },
        retraites: { label: "Retraités", weight: 27.0, score: 50 },
        inactifs: { label: "Jeunes/Inactifs", weight: 16.0, score: 50 }
    };

    // --- 3. BASE DE DONNEES HISTORIQUE (Events) ---
    // weight: 1 (Anecdote), 2 (Important), 3 (Tournant majeur)
    // type: 'general', 'specific', 'debate'
    const RAW_EVENTS = [
        { date: "2016-04-06", title: "Lancement d'En Marche !", desc: "Emmanuel Macron lance son mouvement à Amiens. Personne ne sait encore s'il ira au bout.", weight: 2, type: 'general', effects: { cadres: 3, inactifs: 3, retraites: -2 } },
        { date: "2016-08-30", title: "Démission de Bercy", desc: "Macron quitte le gouvernement Hollande. La trahison est consommée.", weight: 2, type: 'general', effects: { cadres: 2, ouvriers: -2 } },
        { date: "2016-11-20", title: "Primaires Droite : Le Choc", desc: "Sarkozy éliminé, Fillon écrase tout le monde avec 44%. Une dynamique ultra-conservatrice.", weight: 3, type: 'general', effects: { retraites: 5, agriculteurs: 5, inactifs: -3 } },
        { date: "2016-12-01", title: "Renoncement de Hollande", desc: "Le Président sortant jette l'éponge. Le champ est libre à gauche et au centre.", weight: 3, type: 'general', effects: { intermediaires: 3, employes: 2 } },
        { date: "2017-01-17", title: "La Gifle de Valls", desc: "Manuel Valls reçoit une gifle en Bretagne. Symbole de la violence du rejet du quinquennat.", weight: 1, type: 'general', effects: { ouvriers: -2, inactifs: 3 } },
        { date: "2017-01-24", title: "Le Penelope Gate", desc: "Le Canard Enchaîné révèle les emplois présumés fictifs de l'épouse de Fillon.", weight: 3, specificTo: 'fillon', type: 'scandal', effects: { retraites: -5, cadres: -10, ouvriers: -5 } },
        { date: "2017-01-24", title: "Scandale à Droite", desc: "L'affaire Fillon éclate. La droite est tétanisée.", weight: 3, type: 'general', effects: { cadres: -2, retraites: -2 } },
        { date: "2017-01-29", title: "Victoire de Hamon", desc: "Benoît Hamon remporte la primaire gauche sur une ligne frondeuse. Le PS se fracture.", weight: 2, type: 'general', effects: { inactifs: 5, cadres: -3 } },
        { date: "2017-02-04", title: "Meeting de Lyon", desc: "Un moment clé de la campagne. Vous devez marquer les esprits dans la capitale des Gaules.", weight: 2, type: 'meeting' },
        { date: "2017-02-05", title: "L'Hologramme", desc: "Mélenchon réalise un meeting double grâce à un hologramme. Prouesse technique ou gadget ?", weight: 2, specificTo: 'melenchon', effects: { inactifs: 8, ouvriers: 2 } },
        { date: "2017-02-14", title: "Polémique 'Crime contre l'Humanité'", desc: "À Alger, Macron qualifie ainsi la colonisation. La droite hurle, les pieds-noirs s'insurgent.", weight: 3, specificTo: 'macron', effects: { retraites: -10, inactifs: 5, cadres: -2 } },
        { date: "2017-02-22", title: "Le Ralliement de Bayrou", desc: "François Bayrou propose une alliance. C'est le tournant qui crédibilise le centre.", weight: 3, type: 'general', effects: { cadres: 5, intermediaires: 5, retraites: 2 } },
        { date: "2017-02-22", title: "Immunité Ouvrière", desc: "Marine Le Pen refuse une convocation policière. Poutou s'en souviendra.", weight: 2, specificTo: 'lepen', effects: { ouvriers: 3, cadres: -4 } },
        { date: "2017-03-01", title: "Mise en examen", desc: "Fillon annonce sa mise en examen mais refuse de se retirer. 'Je ne céderai pas'.", weight: 3, specificTo: 'fillon', effects: { retraites: 5, cadres: -5, inactifs: -5 } },
        { date: "2017-03-05", title: "Le Trocadéro", desc: "Fillon réunit ses fidèles sous la pluie et le drapeau tricolore. Démonstration de force ou baroud d'honneur ?", weight: 2, type: 'general', effects: { retraites: 3, cadres: 1 } },
        { date: "2017-03-18", title: "Marche pour la VIe République", desc: "La France Insoumise remplit Bastille. La dynamique Mélenchon s'envole.", weight: 2, type: 'general', effects: { inactifs: 4, ouvriers: 2 } },
        { date: "2017-03-20", title: "Le Grand Débat (TF1)", desc: "Les 5 favoris s'affrontent. C'est le moment de vérité.", weight: 3, type: 'debate' },
        { date: "2017-03-23", title: "Trahison de Valls", desc: "Valls appelle à voter Macron. Hamon est poignardé dans le dos.", weight: 2, type: 'general', effects: { cadres: 2, inactifs: -2 } },
        { date: "2017-03-28", title: "Appel des Grands Élus", desc: "Les maires de droite commencent à soutenir Macron, sentant le vent tourner.", weight: 1, type: 'general', effects: { retraites: 2, cadres: 2 } },
        { date: "2017-04-04", title: "Débat à 11 (BFMTV)", desc: "Le chaos sur le plateau. Poutou attaque Fillon ('Rends l'argent!').", weight: 3, type: 'debate' },
        { date: "2017-04-09", title: "Meeting de Marseille", desc: "Mélenchon et sa brindille d'olivier. Ambiance mystique au Vieux-Port.", weight: 2, type: 'general', effects: { inactifs: 3, ouvriers: 2 } },
        { date: "2017-04-12", title: "Fiscal Kombat", desc: "Mélenchon sort un jeu vidéo où il secoue les oligarques. Buzz chez les jeunes.", weight: 1, specificTo: 'melenchon', effects: { inactifs: 5, retraites: -2 } },
        { date: "2017-04-20", title: "Attentat Champs-Élysées", desc: "Un policier tué à 2 jours du vote. La sécurité revient au centre du jeu.", weight: 3, type: 'general', effects: { retraites: 5, ouvriers: 3, inactifs: -4, cadres: -2 } },
        { date: "2017-04-21", title: "Fin de Campagne", desc: "Trump commente l'attentat. Le silence électoral va commencer.", weight: 1, type: 'general', effects: { cadres: 1 } }
    ];

    // --- 4. ETAT DU JEU ---
    let gameState = {
        candidate: null,
        campaignEvents: [], // La liste filtrée et triée des 30 events
        currentEventIndex: 0
    };

    // --- 5. MOTEUR DE JEU ---

    function initRoster() {
        const div = document.getElementById('roster');
        CANDIDATES.forEach(c => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3 class="gold">${c.name}</h3><small>${c.party}</small>`;
            card.onclick = () => startGame(c);
            div.appendChild(card);
        });
    }

    function buildTimeline(candidate) {
        // 1. Filtrer les events pertinents (Généraux + Spécifiques au candidat)
        let pool = RAW_EVENTS.filter(e => {
            if (e.type === 'debate') return true; // Toujours garder les débats
            if (e.specificTo && e.specificTo !== candidate.id) return false; // Enlever les events spécifiques aux autres
            return true;
        });

        // 2. Séparer les obligatoires (Weight 3 ou Debats) et les optionnels
        let mandatory = pool.filter(e => e.weight >= 3 || e.type === 'debate');
        let fillers = pool.filter(e => e.weight < 3 && e.type !== 'debate');

        // 3. Remplir pour arriver à GAME_LENGTH (30)
        let needed = GAME_LENGTH - mandatory.length;
        // Mélanger les fillers et en prendre 'needed'
        fillers = fillers.sort(() => 0.5 - Math.random()).slice(0, Math.max(0, needed));

        // 4. Fusionner et Trier par date
        let finalTimeline = [...mandatory, ...fillers];
        finalTimeline.sort((a, b) => new Date(a.date) - new Date(b.date));

        // 5. Ajuster si on dépasse ou pas assez (rare avec cette logique, mais sécurité)
        return finalTimeline.slice(0, GAME_LENGTH);
    }

    function startGame(candidate) {
        gameState.candidate = candidate;
        
        // Appliquer stats de base
        for(let k in candidate.baseStats) {
            if(POPULATION[k]) POPULATION[k].score = candidate.baseStats[k];
        }

        // Construire la timeline unique de cette partie
        gameState.campaignEvents = buildTimeline(candidate);
        gameState.currentEventIndex = 0;

        // UI Switch
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('candidate-name').innerText = candidate.name;

        updateUI();
        loadEvent();
    }

    function loadEvent() {
        if (gameState.currentEventIndex >= gameState.campaignEvents.length) {
            endGame();
            return;
        }

        let evt = gameState.campaignEvents[gameState.currentEventIndex];
        
        // Update Header Date
        document.getElementById('date-display').innerText = new Date(evt.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        
        // Update Event Box
        document.getElementById('event-date').innerText = evt.type === 'debate' ? 'DÉBAT TÉLÉVISÉ' : 'ÉVÈNEMENT CAMPAGNE';
        document.getElementById('event-title').innerText = evt.title;
        document.getElementById('event-desc').innerText = evt.desc;
        
        const choicesDiv = document.getElementById('choices-area');
        choicesDiv.innerHTML = '';

        if (evt.type === 'debate') {
            generateDebateChoices(choicesDiv);
        } else {
            generateEventChoices(choicesDiv, evt);
        }
    }

    function generateEventChoices(div, evt) {
        // Choix génériques ou spécifiques basés sur le type d'event
        // Pour simplifier ici, on génère 3 réactions standards + effets de l'event
        
        const reactions = [
            { txt: "Intervenir médiatiquement avec force", mod: { score: 1.2, target: 'cadres' } }, // Risqué
            { txt: "Rester prudent et laisser passer", mod: { score: 0.9, target: 'retraites' } }, // Safe
            { txt: "Utiliser l'événement pour attaquer les adversaires", mod: { score: 1.1, target: 'ouvriers' } } // Agressif
        ];

        reactions.forEach(r => {
            let btn = document.createElement('button');
            btn.className = 'choice';
            btn.innerText = "➤ " + r.txt;
            btn.onclick = () => {
                // Appliquer l'effet inhérent à l'event (s'il en a)
                if(evt.effects) applyEffects(evt.effects, evt.weight);
                // Appliquer petit modificateur du choix
                let choiceEffect = {};
                choiceEffect[r.mod.target] = 2; // Arbitraire pour le gameplay
                applyEffects(choiceEffect, 1);
                
                nextTurn();
            };
            div.appendChild(btn);
        });
    }

    function generateDebateChoices(div) {
        // Logique de débat : attaquer un rival
        let rivals = CANDIDATES.filter(c => c.id !== gameState.candidate.id);
        let targets = rivals.sort(() => 0.5 - Math.random()).slice(0, 3);

        targets.forEach(t => {
            let btn = document.createElement('button');
            btn.className = 'choice';
            btn.innerHTML = `<span style="color:${t.id === 'lepen' || t.id === 'fillon' ? '#3498db' : '#e74c3c'}">Attaquer ${t.name}</span>`;
            btn.onclick = () => {
                // Logique simplifiée : Attaquer Droite plaît à Gauche et inversement
                let impact = {};
                if (['lepen', 'fillon', 'dupont'].includes(t.id)) {
                    impact = { inactifs: 4, ouvriers: 2, cadres: 2, retraites: -3 };
                } else {
                    impact = { retraites: 4, cadres: 3, artisans: 3, inactifs: -4 };
                }
                applyEffects(impact, 3); // Poids 3 pour débat
                nextTurn();
            };
            div.appendChild(btn);
        });
        
        // Option Défense
        let defBtn = document.createElement('button');
        defBtn.className = 'choice';
        defBtn.innerText = "🛡️ Se concentrer sur son programme (Ne pas attaquer)";
        defBtn.onclick = () => {
            applyEffects({ cadres: 2, retraites: 2, intermediaires: 2 }, 2);
            nextTurn();
        }
        div.appendChild(defBtn);
    }

    function applyEffects(effects, weight) {
        // Score = BaseEffect * Weight * CandidateAffinity
        for (let key in effects) {
            if (POPULATION[key]) {
                let base = effects[key];
                let affinity = gameState.candidate.affinities[key] || 1.0; // 1.0 defaut
                
                // Si l'effet est négatif, l'affinité > 1 protège (réduit la perte) ? 
                // Non, restons simple : Affinité = Multiplicateur de gain.
                // Si base < 0 (perte), et affinity > 1 (on est fort sur ce segment), on perd moins ?
                // Disons : Affinity s'applique à la valeur absolue.
                
                let finalVal = base * weight * affinity;
                
                POPULATION[key].score += finalVal;
                
                // Cap
                if (POPULATION[key].score > 100) POPULATION[key].score = 100;
                if (POPULATION[key].score < 0) POPULATION[key].score = 0;
            }
        }
    }

    function nextTurn() {
        gameState.currentEventIndex++;
        updateUI();
        loadEvent();
    }

    function getGlobalScore() {
        let total = 0;
        let w = 0;
        for(let k in POPULATION) {
            total += POPULATION[k].score * POPULATION[k].weight;
            w += POPULATION[k].weight;
        }
        return (total / w);
    }

    function updateUI() {
        // Stats
        const cont = document.getElementById('poll-container');
        cont.innerHTML = '';
        let sorted = Object.keys(POPULATION).sort((a,b) => POPULATION[b].score - POPULATION[a].score);
        
        sorted.forEach(k => {
            let p = POPULATION[k];
            let row = document.createElement('div');
            row.className = 'stat-row';
            let color = p.score > 50 ? 'var(--gold)' : '#fff';
            row.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span>${p.label}</span>
                    <span style="color:${color}">${Math.round(p.score)}%</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" style="width:${p.score}%; background:${color}"></div></div>
            `;
            cont.appendChild(row);
        });

        // Global
        let score = getGlobalScore();
        document.getElementById('main-score').innerText = score.toFixed(1) + "%";
        
        // Trend indicator
        let trend = "Stable";
        if (score > 50) trend = "▲ Élection au 1er tour probable";
        else if (score > 20) trend = "▲ Qualifié 2nd tour";
        else trend = "▼ En difficulté";
        document.getElementById('trend-text').innerText = trend;
    }

    function endGame() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('results-screen').classList.add('active');

        let score = getGlobalScore();
        document.getElementById('end-score').innerText = score.toFixed(2) + "%";

        let statusEl = document.getElementById('end-status');
        let scenarioEl = document.getElementById('end-scenario-text');
        
        let status = "";
        let text = "";

        // SCENARIOS GENERATOR
        if (score >= 50.1) {
            status = "PRÉSIDENT DE LA RÉPUBLIQUE (Dès le 1er Tour !)";
            statusEl.style.color = "#2ecc71";
            
            if (gameState.candidate.id === 'melenchon') {
                text = "Un séisme géopolitique. Dès le lendemain, la France quitte l'OTAN. La bourse de Paris s'effondre de 20% mais une immense fête populaire envahit les rues. La VIème République est proclamée trois mois plus tard.";
            } else if (gameState.candidate.id === 'lepen') {
                text = "L'état de siège. Des manifestations monstres bloquent les grandes villes. Bruxelles menace de sanctions économiques immédiates. Le pays se fracture violemment entre pro et anti-régime.";
            } else if (gameState.candidate.id === 'macron') {
                text = "L'Europe jubile. Les réformes passent par ordonnances à une vitesse fulgurante. La 'Start-up Nation' est en marche, mais dans l'ombre, une colère jaune commence à gronder sur les ronds-points...";
            } else if (gameState.candidate.id === 'fillon') {
                text = "La rigueur absolue. 500.000 fonctionnaires sont supprimés. Les syndicats lancent une grève générale illimitée. La France est à l'arrêt, mais la dette commence à baisser.";
            } else {
                text = "L'improbable s'est produit. Les livres d'histoire ne savent pas comment analyser ce résultat.";
            }

        } else if (score >= 20) {
            status = "QUALIFIÉ POUR LE SECOND TOUR";
            statusEl.style.color = "#f1c40f";
            text = "Vous avez survécu à la campagne la plus violente de l'histoire moderne. Tout reste à faire. Le front républicain tiendra-t-il ? Ou la colère l'emportera-t-elle ?";
        } else if (score >= 5) {
            status = "ÉLIMINÉ";
            statusEl.style.color = "#e67e22";
            text = "Vous pesez dans le débat, mais l'Élysée s'éloigne. Vos frais de campagne sont remboursés. Vous appellerez probablement à voter 'contre l'extrême droite' ou 'ni-ni'.";
        } else {
            status = "HUMILIATION";
            statusEl.style.color = "#c0392b";
            text = "Votre parti est en ruine. Il faudra vendre le siège social pour payer les dettes. C'est la fin d'une carrière.";
        }

        statusEl.innerText = status;
        scenarioEl.innerText = text;
    }

    // START
    initRoster();

</script>
</body>
</html>
