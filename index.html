<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉPUBLIQUE - 2017 Ultimate</title>
    <style>
        :root {
            --navy-deep: #051024; /* Bleu Présidentiel */
            --navy-light: #162447;
            --gold: #d4af37;
            --gold-dim: #8a7329;
            --white: #e0e0e0;
            --glass: rgba(22, 36, 71, 0.95);
            --border: 1px solid rgba(212, 175, 55, 0.3);
        }

        body {
            background-color: var(--navy-deep);
            color: var(--white);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #051024 90%);
        }

        /* --- UI KIT --- */
        .gold { color: var(--gold); }
        .bold { font-weight: 700; }
        
        .panel {
            background: var(--glass);
            border: var(--border);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--navy-light) 0%, #000 100%);
            border: 1px solid var(--gold-dim);
            color: var(--gold);
            padding: 12px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }
        button.btn-primary:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        /* --- SCREENS --- */
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }

        /* SELECTION */
        #selection-screen { align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; width: 90%; max-width: 1000px; margin-top: 20px;}
        .card { 
            padding: 20px; cursor: pointer; border: 1px solid transparent; text-align: center; 
            background: rgba(255,255,255,0.03); transition: 0.2s;
        }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); background: rgba(212, 175, 55, 0.1); }

        /* GAMEBOARD */
        #game-screen {
            display: grid;
            grid-template-columns: 260px 1fr 260px;
            grid-template-rows: 60px 1fr 80px;
            gap: 15px; padding: 15px; box-sizing: border-box;
        }

        header {
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border); padding: 0 10px; background: rgba(5, 16, 36, 0.9);
        }

        /* STATS BARS */
        .stat-line { margin-bottom: 8px; font-size: 0.75em; }
        .bar-container { background: rgba(255,255,255,0.05); height: 6px; margin-top: 3px; border-radius: 2px; }
        .bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); }

        /* CENTER */
        #center-zone { position: relative; display: flex; align-items: center; justify-content: center; }
        .event-card { width: 100%; max-width: 700px; max-height: 80vh; overflow-y: auto; z-index: 10; }
        
        /* CHOICES */
        .choice-btn {
            width: 100%; padding: 15px; margin: 10px 0;
            background: rgba(255,255,255,0.03); border-left: 3px solid var(--gold-dim);
            color: #ccc; text-align: left; cursor: pointer; transition: 0.2s; font-size: 0.95em;
        }
        .choice-btn:hover { background: rgba(212, 175, 55, 0.1); border-left-color: var(--gold); color: #fff; transform: translateX(5px); }
        .choice-italic { font-style: italic; opacity: 0.7; font-size: 0.9em; margin-bottom: 5px; display: block;}

        /* END SCREEN */
        #results-screen { align-items: center; justify-content: center; text-align: center; }
        .end-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin: 20px 0; font-size: 0.9em;}

    </style>
</head>
<body>

<div id="selection-screen" class="screen active">
    <div style="text-align:center;">
        <h1 class="gold" style="font-size: 2.5em; letter-spacing: 5px; margin-bottom: 5px;">RÉPUBLIQUE</h1>
        <span style="text-transform:uppercase; font-size: 0.9em; opacity: 0.7;">Simulateur de Campagne 2017</span>
    </div>
    <div class="grid" id="roster"></div>
</div>

<div id="game-screen" class="screen">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:1.2em;">🏛️</span>
            <span class="bold">ÉLYSÉE 2017</span>
        </div>
        <div id="turn-badge" class="gold bold">SEMAINE 1 / 20</div>
        <div id="candidate-name" style="opacity: 0.7;">Candidat</div>
    </header>

    <div class="panel">
        <h4 class="gold" style="margin: 0 0 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:10px;">SONDAGES CSP</h4>
        <div id="polls-container" style="overflow-y: auto; flex:1;"></div>
    </div>

    <div id="center-zone">
        <div class="panel event-card" id="event-panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span id="event-type" style="background:var(--gold); color:black; padding:2px 8px; font-size:0.7em; font-weight:bold; border-radius:2px;">ACTUALITÉ</span>
                <span id="event-date" style="font-size:0.8em; opacity:0.6;">DATE</span>
            </div>
            <h2 id="event-title" class="gold" style="margin-top:0;">Titre de l'évènement</h2>
            <p id="event-desc" style="line-height: 1.6; font-size: 1.05em; margin-bottom: 25px;">Description...</p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="panel" style="align-items:center; justify-content:center;">
        <span style="font-size:0.8em; text-transform:uppercase; opacity:0.7;">Intentions de vote</span>
        <div id="main-score" style="font-size: 4em; font-weight: 800; color: var(--gold); margin: 10px 0;">0%</div>
        <div id="trend-indicator" style="font-size: 0.9em;">--</div>
    </div>

    <div class="panel" style="grid-column: 1 / -1; flex-direction: row; justify-content: space-around; align-items: center; opacity: 0.8;">
        <span>📢 MEETING</span>
        <span>📺 MÉDIAS</span>
        <span>💰 BUDGET</span>
        <span>👥 QG</span>
    </div>
</div>

<div id="results-screen" class="screen">
    <h1 class="gold" style="letter-spacing: 5px;">RÉSULTATS</h1>
    
    <div class="panel" style="width: 500px; max-width:90%;">
        <div id="final-score" style="font-size: 5em; font-weight: 800; color: var(--gold);">00.0%</div>
        <h3 id="final-status">STATUT</h3>
        <p id="final-desc" style="font-style:italic; line-height:1.5;">...</p>
        
        <div style="border-top:1px solid rgba(255,255,255,0.1); margin-top:20px; padding-top:10px;">
            <small>Détail par catégorie :</small>
            <div class="end-stat-grid" id="final-grid"></div>
        </div>
    </div>
    
    <button class="btn-primary" onclick="location.reload()" style="margin-top:20px;">NOUVELLE CAMPAGNE</button>
</div>

<script>
    // --- CONFIGURATION ---
    const MAX_TURNS = 20; 
    const IMPACT_REDUCER = 0.35; // Facteur pour réduire l'impact des réponses (0.35 = 35% de la puissance originale)

    // --- DONNEES POPULATION ---
    const POPULATION = {
        agriculteurs: { label: "Agriculteurs", weight: 1.5, score: 0 },
        artisans: { label: "Artisans/Chefs", weight: 6.7, score: 0 },
        cadres: { label: "Cadres/Sup", weight: 22.4, score: 0 },
        intermediaires: { label: "Prof. Interm.", weight: 25.1, score: 0 },
        employes: { label: "Employés", weight: 25.2, score: 0 },
        ouvriers: { label: "Ouvriers", weight: 18.6, score: 0 },
        retraites: { label: "Retraités", weight: 27.0, score: 0 },
        inactifs: { label: "Jeunes/Inactifs", weight: 16.0, score: 0 }
    };

    // --- CANDIDATS (Stats Janvier 2017 - Somme ~100%) ---
    const CANDIDATES = [
        { id: 'macron', name: "E. MACRON", party: "En Marche!", stats: { agriculteurs: 15, artisans: 15, cadres: 32, intermediaires: 26, employes: 18, ouvriers: 12, retraites: 22, inactifs: 22 } },
        { id: 'fillon', name: "F. FILLON", party: "Les Républicains", stats: { agriculteurs: 45, artisans: 35, cadres: 30, intermediaires: 18, employes: 10, ouvriers: 5, retraites: 42, inactifs: 8 } },
        { id: 'lepen', name: "M. LE PEN", party: "Front National", stats: { agriculteurs: 20, artisans: 28, cadres: 8, intermediaires: 22, employes: 38, ouvriers: 48, retraites: 12, inactifs: 20 } },
        { id: 'melenchon', name: "J-L. MÉLENCHON", party: "LFI", stats: { agriculteurs: 3, artisans: 5, cadres: 10, intermediaires: 12, employes: 14, ouvriers: 18, retraites: 8, inactifs: 18 } },
        { id: 'hamon', name: "B. HAMON", party: "Parti Socialiste", stats: { agriculteurs: 2, artisans: 4, cadres: 15, intermediaires: 16, employes: 12, ouvriers: 8, retraites: 10, inactifs: 18 } },
        { id: 'dupont', name: "N. DUPONT-AIGNAN", party: "DLF", stats: { agriculteurs: 6, artisans: 5, cadres: 2, intermediaires: 3, employes: 3, ouvriers: 3, retraites: 3, inactifs: 2 } },
        { id: 'lassalle', name: "J. LASSALLE", party: "Résistons", stats: { agriculteurs: 8, artisans: 2, cadres: 0, intermediaires: 1, employes: 1, ouvriers: 1, retraites: 1, inactifs: 1 } },
        { id: 'poutou', name: "P. POUTOU", party: "NPA", stats: { agriculteurs: 0, artisans: 0, cadres: 1, intermediaires: 1, employes: 2, ouvriers: 4, retraites: 0, inactifs: 4 } },
        { id: 'arthaud', name: "N. ARTHAUD", party: "LO", stats: { agriculteurs: 0, artisans: 0, cadres: 0, intermediaires: 0, employes: 1, ouvriers: 1, retraites: 0, inactifs: 1 } },
        { id: 'asselineau', name: "F. ASSELINEAU", party: "UPR", stats: { agriculteurs: 1, artisans: 1, cadres: 1, intermediaires: 1, employes: 1, ouvriers: 0, retraites: 1, inactifs: 2 } },
        { id: 'cheminade', name: "J. CHEMINADE", party: "S&P", stats: { agriculteurs: 0, artisans: 0, cadres: 0, intermediaires: 0, employes: 0, ouvriers: 0, retraites: 0, inactifs: 0 } }
    ];

    // --- QUESTIONS & CHOIX (Dynamiques) ---
    // Chaque event a des choix spécifiques.
    const EVENTS = [
        {
            title: "Le Penelope Gate",
            desc: "Le Canard Enchaîné révèle que l'épouse de Fillon a perçu 500.000€ d'argent public. C'est la panique.",
            choices: [
                { txt: "Crier au complot et dénoncer le 'Cabinet Noir' de l'Élysée.", cond: 'fillon', eff: { retraites: 3, cadres: -5, ouvriers: -5 } },
                { txt: "Attaquer frontalement : 'Il faut rendre l'argent !'", eff: { ouvriers: 4, inactifs: 3, cadres: -2 } },
                { txt: "Rester prudent : 'Laissons la justice faire son travail.'", eff: { cadres: 2, retraites: 1 } },
                { txt: "Dénoncer tous les privilèges et la corruption du système.", eff: { inactifs: 4, ouvriers: 3, artisans: 2 } }
            ]
        },
        {
            title: "La Gifle de Valls",
            desc: "Manuel Valls reçoit une gifle lors d'un déplacement en Bretagne. La violence politique monte.",
            choices: [
                { txt: "Condamner fermement : 'La violence n'a pas sa place en démocratie'.", eff: { retraites: 2, cadres: 2 } },
                { txt: "Ironiser : 'C'est le retour de bâton de sa politique'.", eff: { inactifs: 3, ouvriers: 2, cadres: -3 } },
                { txt: "Dire qu'on comprend la colère du peuple, sans cautionner le geste.", eff: { ouvriers: 2, intermediaires: 1 } }
            ]
        },
        {
            title: "Meeting Hologramme",
            desc: "Un candidat utilise un hologramme pour être à deux endroits à la fois. Un coup de com' technologique.",
            choices: [
                { txt: "Utiliser cette technologie (ou saluer l'audace).", eff: { inactifs: 5, cadres: 1 } },
                { txt: "Moquer le 'gadget' qui cache le vide du programme.", eff: { retraites: 2, ouvriers: 1 } },
                { txt: "Ignorer et parler du terrain, de la vraie vie.", eff: { agriculteurs: 3, artisans: 2 } }
            ]
        },
        {
            title: "Polémique 'Colonisation'",
            desc: "Un candidat qualifie la colonisation de 'Crime contre l'humanité'. La droite s'indigne.",
            choices: [
                { txt: "Assumer : 'Il faut regarder l'Histoire en face'.", eff: { inactifs: 6, retraites: -6, agriculteurs: -4 } },
                { txt: "S'excuser pour ne pas blesser les rapatriés.", eff: { retraites: 3, inactifs: -3 } },
                { txt: "Hurler à la honte et à la détestation de la France.", eff: { retraites: 5, agriculteurs: 4, cadres: -2 } },
                { txt: "Nuancer : Des crimes, mais aussi des choses positives.", eff: { cadres: 2, intermediaires: 2 } }
            ]
        },
        {
            title: "Usine Whirlpool",
            desc: "L'usine d'Amiens menace de fermer. C'est le symbole de la désindustrialisation.",
            choices: [
                { txt: "Aller parler aux ouvriers sur le parking, au milieu des fumées.", eff: { ouvriers: 6, employes: 3, cadres: -3 } },
                { txt: "Rencontrer l'intersyndicale à la Chambre de Commerce.", eff: { cadres: 3, intermediaires: 1 } },
                { txt: "Promettre la nationalisation si nécessaire.", eff: { ouvriers: 4, inactifs: 3, cadres: -4 } }
            ]
        },
        {
            title: "Le Choc Bayrou",
            desc: "François Bayrou propose une alliance au centre. Acceptez-vous la main tendue ?",
            choices: [
                { txt: "Accepter l'alliance pour crédibiliser la démarche.", eff: { cadres: 5, intermediaires: 3, retraites: 2, ouvriers: -2 } },
                { txt: "Refuser : 'Pas d'arrangement avec la vieille politique'.", eff: { inactifs: 3, ouvriers: 2 } },
                { txt: "Critiquer l'opportunisme de Bayrou.", eff: { artisans: 2, agriculteurs: 2 } }
            ]
        },
        {
            title: "Grand Débat TF1",
            desc: "Les 5 favoris sont sur le plateau. C'est le moment de placer une 'punchline'.",
            choices: [
                { txt: "Attaquer Fillon/Le Pen sur les affaires judiciaires.", eff: { cadres: 3, inactifs: 2, retraites: -2 } },
                { txt: "Se poser en victime du système médiatique.", eff: { ouvriers: 3, artisans: 3, cadres: -3 } },
                { txt: "Rester calme et détailler le chiffrage du programme.", eff: { cadres: 4, retraites: 2 } },
                { txt: "Sortir une phrase culte ('Pudeur de gazelle', 'Poudre de perlimpinpin').", eff: { inactifs: 4, intermediaires: 2 } }
            ]
        },
        {
            title: "Attentat Champs-Élysées",
            desc: "Un policier est tué à 3 jours du vote. Le pays est sous le choc.",
            choices: [
                { txt: "Exiger la fermeture immédiate des frontières.", eff: { retraites: 5, ouvriers: 3, cadres: -4, inactifs: -4 } },
                { txt: "Appeler solennellement à l'unité nationale.", eff: { cadres: 3, intermediaires: 3, retraites: 2 } },
                { txt: "Dénoncer le laxisme du gouvernement sortant.", eff: { artisans: 3, retraites: 2 } }
            ]
        },
        {
            title: "Révélations Wikileaks",
            desc: "Des emails de campagne sont piratés et diffusés massivement.",
            choices: [
                { txt: "Crier à l'ingérence russe.", eff: { cadres: 3, intermediaires: 1 } },
                { txt: "Ne rien dire, laisser la rumeur s'éteindre.", eff: { retraites: 1 } },
                { txt: "Utiliser ces fuites pour attaquer l'adversaire concerné.", eff: { inactifs: 3, ouvriers: 2 } }
            ]
        },
        {
            title: "Dernière ligne droite",
            desc: "Plus que 24h. Où jetez-vous vos dernières forces ?",
            choices: [
                { txt: "Un grand direct sur Facebook/Youtube pour les jeunes.", eff: { inactifs: 6, intermediaires: 1, retraites: -3 } },
                { txt: "Une interview au 20H de TF1 pour rassurer.", eff: { retraites: 4, cadres: 2 } },
                { txt: "Un déplacement surprise dans une zone rurale oubliée.", eff: { agriculteurs: 5, artisans: 3 } }
            ]
        }
    ];

    // --- MEETINGS ---
    const MEETING_PLACES = [
        { name: "Paris (Bercy)", type: "Grand-Messe", eff: { cadres: 4, intermediaires: 3, ouvriers: -2 } },
        { name: "Hénin-Beaumont", type: "Populaire", eff: { ouvriers: 5, employes: 3, cadres: -4 } },
        { name: "La Courneuve", type: "Banlieue", eff: { inactifs: 6, ouvriers: 2, retraites: -4 } },
        { name: "Nice", type: "Sécuritaire", eff: { retraites: 5, artisans: 3, inactifs: -3 } },
        { name: "Quimper", type: "Régional", eff: { agriculteurs: 4, artisans: 3 } },
        { name: "Saclay", type: "Tech/Innovation", eff: { cadres: 5, inactifs: 3, ouvriers: -3 } },
        { name: "Vénissieux", type: "Ouvrier", eff: { ouvriers: 5, inactifs: 2, cadres: -3 } },
        { name: "Versailles", type: "Conservateur", eff: { retraites: 6, cadres: 2, inactifs: -4 } }
    ];

    // --- GAME STATE ---
    let gameState = {
        candidate: null,
        turn: 1,
        eventQueue: []
    };

    // --- MOTEUR ---

    function initRoster() {
        const d = document.getElementById('roster');
        CANDIDATES.forEach(c => {
            let el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<h3 class="gold">${c.name}</h3><small>${c.party}</small>`;
            el.onclick = () => startGame(c);
            d.appendChild(el);
        });
    }

    function startGame(c) {
        gameState.candidate = c;
        gameState.turn = 1;
        
        // Init Stats
        for (let k in c.stats) {
            if(POPULATION[k]) POPULATION[k].score = c.stats[k];
        }

        // Init Events: On mélange les events pour avoir un ordre différent à chaque fois (sauf Penelope qui arrive souvent tôt)
        let shuffled = [...EVENTS].sort(() => 0.5 - Math.random());
        // On s'assure d'avoir assez d'events pour remplir les tours non-meeting
        // (Turn 1..20. Meetings turns: 4, 8, 12, 16. Donc 4 meetings, 16 events. Il nous faut 16 events.)
        // Si pas assez, on boucle ou on duplique. Ici on a 10 events uniques dans la liste ci-dessus, 
        // pour la démo on va les répéter si besoin ou arrêter le jeu plus tôt si liste vide.
        gameState.eventQueue = shuffled;

        // UI
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('candidate-name').innerText = c.name;

        updateUI();
        playTurn();
    }

    function playTurn() {
        // --- SECURITE FIN DE JEU (Anti-boucle infinie) ---
        if (gameState.turn > MAX_TURNS || gameState.eventQueue.length === 0) {
            endGame();
            return; // STOP EXECUTION
        }

        // --- MEETING TOUS LES 4 TOURS ---
        if (gameState.turn % 4 === 0) {
            showMeeting();
        } else {
            // Event normal
            let evt = gameState.eventQueue.shift(); // Prend le prochain
            if(!evt) { endGame(); return; } // Plus d'event ? Fin.
            showEvent(evt);
        }
    }

    function showEvent(evt) {
        document.getElementById('turn-badge').innerText = `SEMAINE ${gameState.turn} / ${MAX_TURNS}`;
        document.getElementById('event-type').innerText = "ACTUALITÉ";
        document.getElementById('event-type').style.background = "var(--gold)";
        document.getElementById('event-date').innerText = "Campagne officielle";
        
        document.getElementById('event-title').innerText = evt.title;
        document.getElementById('event-desc').innerText = evt.desc;

        const c = document.getElementById('choices-container');
        c.innerHTML = '';

        evt.choices.forEach(ch => {
            // Check condition (ex: Fillon only)
            if (ch.cond && ch.cond !== gameState.candidate.id) return;

            let btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = "➤ " + ch.txt;
            btn.onclick = () => {
                applyEffect(ch.eff);
                nextTurn();
            };
            c.appendChild(btn);
        });
    }

    function showMeeting() {
        document.getElementById('turn-badge').innerText = `SEMAINE ${gameState.turn} / ${MAX_TURNS}`;
        document.getElementById('event-type').innerText = "ORGANISATION";
        document.getElementById('event-type').style.background = "#fff";
        document.getElementById('event-date').innerText = "Stratégie Territoriale";

        document.getElementById('event-title').innerText = "Grand Meeting";
        document.getElementById('event-desc').innerText = "C'est l'heure de rassembler vos militants. Choisissez une ville stratégique pour votre meeting cette semaine.";

        const c = document.getElementById('choices-container');
        c.innerHTML = '';

        // Pick 3 random places
        let places = [...MEETING_PLACES].sort(() => 0.5 - Math.random()).slice(0, 3);
        
        places.forEach(p => {
            let btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span class="bold">${p.name}</span> <span class="choice-italic">Cible: ${p.type}</span>`;
            btn.onclick = () => {
                applyEffect(p.eff);
                nextTurn();
            };
            c.appendChild(btn);
        });
    }

    function applyEffect(eff) {
        for (let k in eff) {
            if(POPULATION[k]) {
                // Application du NERF (Impact Reducer)
                let val = eff[k] * IMPACT_REDUCER;
                POPULATION[k].score += val;
                // Caps strictes
                if(POPULATION[k].score < 0) POPULATION[k].score = 0;
                if(POPULATION[k].score > 100) POPULATION[k].score = 100;
            }
        }
    }

    function nextTurn() {
        gameState.turn++;
        updateUI();
        playTurn(); // Loop
    }

    function getGlobalScore() {
        let total = 0;
        let w = 0;
        for(let k in POPULATION) {
            total += POPULATION[k].score * POPULATION[k].weight;
            w += POPULATION[k].weight;
        }
        return total / w;
    }

    function updateUI() {
        // Polls
        const d = document.getElementById('polls-container');
        d.innerHTML = '';
        let sorted = Object.keys(POPULATION).sort((a,b) => POPULATION[b].score - POPULATION[a].score);
        
        sorted.forEach(k => {
            let p = POPULATION[k];
            let row = document.createElement('div');
            row.className = 'stat-line';
            let color = p.score > 50 ? 'var(--gold)' : (p.score < 15 ? '#c0392b' : '#ccc');
            
            row.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span>${p.label}</span>
                    <span style="color:${color}">${p.score.toFixed(1)}%</span>
                </div>
                <div class="bar-container"><div class="bar-fill" style="width:${p.score}%; background:${color}"></div></div>
            `;
            d.appendChild(row);
        });

        // Global
        let sc = getGlobalScore();
        document.getElementById('main-score').innerText = sc.toFixed(1) + "%";
        
        // Trend
        let t = "Stable";
        if (sc >= 50) t = "▲ Élu 1er tour";
        else if (sc >= 20) t = "▲ Qualifié 2nd tour";
        else t = "▼ En difficulté";
        document.getElementById('trend-indicator').innerText = t;
    }

    function endGame() {
        // Force Hide Game / Show Results
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('game-screen').style.display = 'none'; // Double sécurité
        
        document.getElementById('results-screen').classList.add('active');
        document.getElementById('results-screen').style.display = 'flex';

        let sc = getGlobalScore();
        document.getElementById('final-score').innerText = sc.toFixed(2) + "%";

        let st = ""; 
        let txt = "";
        
        if (sc >= 50) {
            st = "PRÉSIDENT DE LA RÉPUBLIQUE";
            txt = "Un triomphe absolu dès le premier tour. Du jamais vu.";
        } else if (sc >= 18) {
            st = "QUALIFIÉ SECOND TOUR";
            txt = "La bataille continue. Vous êtes en finale.";
        } else if (sc >= 5) {
            st = "DÉFAITE";
            txt = "Vous ne serez pas président, mais l'honneur est sauf.";
        } else {
            st = "NAUFRAGE";
            txt = "Score humiliant. Votre parti va disparaître.";
        }

        document.getElementById('final-status').innerText = st;
        document.getElementById('final-desc').innerText = txt;

        // Grid details
        const g = document.getElementById('final-grid');
        g.innerHTML = '';
        Object.keys(POPULATION).forEach(k => {
            let p = POPULATION[k];
            g.innerHTML += `<div><strong>${p.label}:</strong> ${Math.round(p.score)}%</div>`;
        });
    }

    // Start
    initRoster();

</script>
</body>
</html>
